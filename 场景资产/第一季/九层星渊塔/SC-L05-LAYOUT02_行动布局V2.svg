<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#243746" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#86cbd0"/></marker></defs><style>text{font-family:Microsoft YaHei,sans-serif}</style><rect width="100%" height="100%" fill="#0e1822"/><rect x="50" y="230" width="3110" height="1670" rx="24" fill="url(#grid)" stroke="#354b5a" stroke-width="3"/><text x="64" y="105" font-size="64" font-weight="bold" fill="#86cbd0">SC-L05｜残舰灵墟 · 行动与因果布局 V2</text><text x="66" y="175" font-size="31" fill="#b9c8d2">第一季 第14—17集　｜　方向：左侧入域 → 右侧阶段终点　｜　示意不等比，箭头含行动、调度及信息关系</text><path d="M330 330L500 1800" stroke="#86cbd0" stroke-width="18" opacity="0.07"/><path d="M750 330L860 1800" stroke="#86cbd0" stroke-width="18" opacity="0.07"/><path d="M1170 330L1220 1800" stroke="#86cbd0" stroke-width="18" opacity="0.07"/><path d="M1590 330L1580 1800" stroke="#86cbd0" stroke-width="18" opacity="0.07"/><path d="M2010 330L1940 1800" stroke="#86cbd0" stroke-width="18" opacity="0.07"/><path d="M2430 330L2300 1800" stroke="#86cbd0" stroke-width="18" opacity="0.07"/><path d="M2850 330L2660 1800" stroke="#86cbd0" stroke-width="18" opacity="0.07"/><path d="M410 1190Q745 885 1080 710" fill="none" stroke="#86cbd0" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="560" y="835" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="580" y="873" font-size="24" fill="#d3e0e8">近战 / 切限位链</text><path d="M1080 710Q1090 1175 1100 1510" fill="none" stroke="#86cbd0" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="905" y="1125" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="925" y="1163" font-size="24" fill="#d3e0e8">单源失败后双源授权</text><path d="M1100 1510Q1440 1270 1780 1160" fill="none" stroke="#86cbd0" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1255" y="1220" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1275" y="1258" font-size="24" fill="#d3e0e8">取得观测权限</text><path d="M1780 1160Q2080 1010 2380 730" fill="none" stroke="#86cbd0" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" stroke-dasharray="20 15"/><rect x="1895" y="960" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1915" y="998" font-size="24" fill="#d3e0e8">仅观测与调灯 / 不可跨相位</text><path d="M1780 1160Q2075 1290 2370 1550" fill="none" stroke="#86cbd0" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1890" y="1240" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1910" y="1278" font-size="24" fill="#d3e0e8">放弃多取档案</text><path d="M2370 1550Q2640 1415 2910 1150" fill="none" stroke="#86cbd0" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2455" y="1365" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2475" y="1403" font-size="24" fill="#d3e0e8">携名册与薄页离开</text><rect x="235" y="1103" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#86cbd0" stroke-width="3"/><text x="260" y="1146" font-size="30" font-weight="bold" fill="#86cbd0">A</text><text x="260" y="1194" font-size="29" fill="#edf2f5">古封门 / 压力界</text><rect x="905" y="623" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#86cbd0" stroke-width="3"/><text x="930" y="666" font-size="30" font-weight="bold" fill="#86cbd0">B</text><text x="930" y="714" font-size="29" fill="#edf2f5">铁卫双臂轨</text><rect x="925" y="1423" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#86cbd0" stroke-width="3"/><text x="950" y="1466" font-size="30" font-weight="bold" fill="#86cbd0">C</text><text x="950" y="1514" font-size="29" fill="#edf2f5">双认证柱 / 两位</text><rect x="1605" y="1073" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#86cbd0" stroke-width="3"/><text x="1630" y="1116" font-size="30" font-weight="bold" fill="#86cbd0">D</text><text x="1630" y="1164" font-size="29" fill="#edf2f5">相位观察窗</text><rect x="2205" y="643" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#86cbd0" stroke-width="3"/><text x="2230" y="686" font-size="30" font-weight="bold" fill="#86cbd0">E</text><text x="2230" y="734" font-size="29" fill="#edf2f5">十二舱观测影像</text><rect x="2195" y="1463" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#86cbd0" stroke-width="3"/><text x="2220" y="1506" font-size="30" font-weight="bold" fill="#86cbd0">F</text><text x="2220" y="1554" font-size="29" fill="#edf2f5">维护廊 / 水气藻床</text><rect x="2735" y="1063" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#86cbd0" stroke-width="3"/><text x="2760" y="1106" font-size="30" font-weight="bold" fill="#86cbd0">G</text><text x="2760" y="1154" font-size="29" fill="#edf2f5">上行逃廊</text><rect x="3220" y="230" width="560" height="1670" rx="24" fill="#182735" stroke="#3f5462" stroke-width="3"/><text x="3250" y="325" font-size="34" font-weight="bold" fill="#86cbd0">危险与不可绕过</text><text x="3250" y="390" font-size="27" fill="#d2dce2">观察窗后不是一臂就能砸开的玻璃房</text><text x="3250" y="431" font-size="27" fill="#d2dce2">。图中D—E为信息关系，不是可走</text><text x="3250" y="472" font-size="27" fill="#d2dce2">通道；单源强灌会损失近期同步记忆</text><text x="3250" y="513" font-size="27" fill="#d2dce2">。</text><text x="3250" y="850" font-size="34" font-weight="bold" fill="#86cbd0">连续性锁</text><text x="3250" y="915" font-size="27" fill="#d2dce2">14集手抖留下长期后果；16集十</text><text x="3250" y="956" font-size="27" fill="#d2dce2">二单人舱含小满，第三层沈砚另计共</text><text x="3250" y="997" font-size="27" fill="#d2dce2">13人。17集水气、藻床、备件真</text><text x="3250" y="1038" font-size="27" fill="#d2dce2">实铺垫十层生活。</text><text x="3250" y="1370" font-size="34" font-weight="bold" fill="#86cbd0">镜头接触重点</text><text x="3250" y="1435" font-size="27" fill="#d2dce2">铁卫双臂扫区、认证双位、无源观测</text><text x="3250" y="1476" font-size="27" fill="#d2dce2">环、铜片无法跨相位、名册压印与藻</text><text x="3250" y="1517" font-size="27" fill="#d2dce2">床补给逐项近景。</text><text x="70" y="1995" font-size="31" fill="#d2dce2">蓝色节点是功能位置，不代表可任意穿越；实线亦可能是调度关系，须以箭头文字和剧本判断。</text><text x="70" y="2055" font-size="29" fill="#a8b7c3">制作检查：演员走位、兵器半径、距离、绳长与承重仍需分镜实测；本图不提供工程安全数值。</text><text x="70" y="2115" font-size="29" fill="#a8b7c3">独立建立图负责奇观与材质；本图负责行动因果。两者不一致时按剧本与本图修订环境，禁止静默改剧情。</text></svg>