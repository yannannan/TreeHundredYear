<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#243746" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d9b38a"/></marker></defs><style>text{font-family:Microsoft YaHei,sans-serif}</style><rect width="100%" height="100%" fill="#0e1822"/><rect x="50" y="230" width="3110" height="1670" rx="24" fill="url(#grid)" stroke="#354b5a" stroke-width="3"/><text x="64" y="105" font-size="64" font-weight="bold" fill="#d9b38a">SC-L03｜星蚀沙海 · 行动与因果布局 V2</text><text x="66" y="175" font-size="31" fill="#b9c8d2">第一季 第09—11集　｜　方向：左侧入域 → 右侧阶段终点　｜　示意不等比，箭头含行动、调度及信息关系</text><path d="M100 650Q750 370 1550 670T3100 620" stroke="#c8ad8c" opacity="0.15" stroke-width="9" fill="none"/><path d="M100 830Q750 520 1550 810T3100 785" stroke="#c8ad8c" opacity="0.15" stroke-width="9" fill="none"/><path d="M100 1010Q750 670 1550 950T3100 950" stroke="#c8ad8c" opacity="0.15" stroke-width="9" fill="none"/><path d="M100 1190Q750 820 1550 1090T3100 1115" stroke="#c8ad8c" opacity="0.15" stroke-width="9" fill="none"/><path d="M100 1370Q750 970 1550 1230T3100 1280" stroke="#c8ad8c" opacity="0.15" stroke-width="9" fill="none"/><path d="M100 1550Q750 1120 1550 1370T3100 1445" stroke="#c8ad8c" opacity="0.15" stroke-width="9" fill="none"/><path d="M420 1240Q765 1310 1110 1510" fill="none" stroke="#d9b38a" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="580" y="1260" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="600" y="1298" font-size="24" fill="#d3e0e8">三人实体避让</text><path d="M1110 1510Q1445 1400 1780 1160" fill="none" stroke="#d9b38a" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1260" y="1350" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1280" y="1388" font-size="24" fill="#d3e0e8">撤法 / 改低拱</text><path d="M1070 650Q1425 840 1780 1160" fill="none" stroke="#d9b38a" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1240" y="790" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1260" y="828" font-size="24" fill="#d3e0e8">诱饵向外 / 人向内</text><path d="M1780 1160Q2075 1025 2370 760" fill="none" stroke="#d9b38a" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1890" y="975" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1910" y="1013" font-size="24" fill="#d3e0e8">三人趴行</text><path d="M2370 760Q2370 1080 2370 1530" fill="none" stroke="#d9b38a" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2185" y="1030" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2205" y="1068" font-size="24" fill="#d3e0e8">实测水气 / 分配残量</text><path d="M2370 1530Q2635 1405 2900 1150" fill="none" stroke="#d9b38a" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2450" y="1355" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2470" y="1393" font-size="24" fill="#d3e0e8">双主上行 / 沈砚留下</text><rect x="245" y="1153" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d9b38a" stroke-width="3"/><text x="270" y="1196" font-size="30" font-weight="bold" fill="#d9b38a">A</text><text x="270" y="1244" font-size="29" fill="#edf2f5">入域沙脊</text><rect x="895" y="563" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d9b38a" stroke-width="3"/><text x="920" y="606" font-size="30" font-weight="bold" fill="#d9b38a">B</text><text x="920" y="654" font-size="29" fill="#edf2f5">外放本源猎引区</text><rect x="935" y="1423" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d9b38a" stroke-width="3"/><text x="960" y="1466" font-size="30" font-weight="bold" fill="#d9b38a">C</text><text x="960" y="1514" font-size="29" fill="#edf2f5">首次立板失败点</text><rect x="1605" y="1073" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d9b38a" stroke-width="3"/><text x="1630" y="1116" font-size="30" font-weight="bold" fill="#d9b38a">D</text><text x="1630" y="1164" font-size="29" fill="#edf2f5">顺风低拱 / 地钉</text><rect x="2195" y="673" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d9b38a" stroke-width="3"/><text x="2220" y="716" font-size="30" font-weight="bold" fill="#d9b38a">E</text><text x="2220" y="764" font-size="29" fill="#edf2f5">避难舱 / 水气阀</text><rect x="2195" y="1443" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d9b38a" stroke-width="3"/><text x="2220" y="1486" font-size="30" font-weight="bold" fill="#d9b38a">F</text><text x="2220" y="1534" font-size="29" fill="#edf2f5">晶匣分配位</text><rect x="2725" y="1063" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d9b38a" stroke-width="3"/><text x="2750" y="1106" font-size="30" font-weight="bold" fill="#d9b38a">G</text><text x="2750" y="1154" font-size="29" fill="#edf2f5">升层攀梯</text><rect x="3220" y="230" width="560" height="1670" rx="24" fill="#182735" stroke="#3f5462" stroke-width="3"/><text x="3250" y="325" font-size="34" font-weight="bold" fill="#d9b38a">危险与不可绕过</text><text x="3250" y="390" font-size="27" fill="#d2dce2">沙鳐追外放本源，不追普通灯。低拱</text><text x="3250" y="431" font-size="27" fill="#d2dce2">能容人趴行而不容巨兽，第一次立板</text><text x="3250" y="472" font-size="27" fill="#d2dce2">过直会掀翻；别画成可直立逃走的宽</text><text x="3250" y="513" font-size="27" fill="#d2dce2">阔隧道。</text><text x="3250" y="850" font-size="34" font-weight="bold" fill="#d9b38a">连续性锁</text><text x="3250" y="915" font-size="27" fill="#d2dce2">沈砚为第三名成人、腿伤不能攀梯。</text><text x="3250" y="956" font-size="27" fill="#d2dce2">10集剑锋磨钝、肩衣刮裂，耗能令</text><text x="3250" y="997" font-size="27" fill="#d2dce2">再生暂停；11集他留避难舱，不能</text><text x="3250" y="1038" font-size="27" fill="#d2dce2">在12集跟着主角出现。</text><text x="3250" y="1370" font-size="34" font-weight="bold" fill="#d9b38a">镜头接触重点</text><text x="3250" y="1435" font-size="27" fill="#d2dce2">砂粒方向、板与地钉受力、避难门阀</text><text x="3250" y="1476" font-size="27" fill="#d2dce2">、晶匣两支路和攀梯口分别拍清；生</text><text x="3250" y="1517" font-size="27" fill="#d2dce2">命维持与导航供能不能一格电同时满</text><text x="3250" y="1558" font-size="27" fill="#d2dce2">供。</text><text x="70" y="1995" font-size="31" fill="#d2dce2">蓝色节点是功能位置，不代表可任意穿越；实线亦可能是调度关系，须以箭头文字和剧本判断。</text><text x="70" y="2055" font-size="29" fill="#a8b7c3">制作检查：演员走位、兵器半径、距离、绳长与承重仍需分镜实测；本图不提供工程安全数值。</text><text x="70" y="2115" font-size="29" fill="#a8b7c3">独立建立图负责奇观与材质；本图负责行动因果。两者不一致时按剧本与本图修订环境，禁止静默改剧情。</text></svg>