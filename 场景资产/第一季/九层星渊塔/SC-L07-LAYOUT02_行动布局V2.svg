fill="#b5cad5">E</text><text x="1630" y="1574" font-size="29" fill="#edf2f5">远环坠石路</text><rect x="2205" y="1493" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#b5cad5" stroke-width="3"/><text x="2230" y="1536" font-size="30" font-weight="bold" fill="#b5cad5">F</text><text x="2230" y="1584" font-size="29" fill="#edf2f5">双钟 / 空载双席</text><rect x="2745" y="1073" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#b5cad5" stroke-width="3"/><text x="2770" y="1116" font-size="30" font-weight="bold" fill="#b5cad5">G</text><text x="2770" y="1164" font-size="29" fill="#edf2f5">通往八层</text><rect x="3220" y="230" width="560" height="1670" rx="24" fill="#182735" stroke="#3f5462" stroke-width="3"/><text x="3250" y="325" font-size="34" font-weight="bold" fill="#b5cad5">危险与不可绕过</text><text x="3250" y="390" font-size="27" fill="#d2dce2">近道撤销后不能又走近道。移桥先卡</text><text x="3250" y="431" font-size="27" fill="#d2dce2">死、首次回摆失败、第二次落槽；救</text><text x="3250" y="472" font-size="27" fill="#d2dce2">四舱的同时失去八舱额外缓冲，但八</text><text x="3250" y="513" font-size="27" fill="#d2dce2">舱仍有较长现存储备。</text><text x="3250" y="850" font-size="34" font-weight="bold" fill="#b5cad5">连续性锁</text><text x="3250" y="915" font-size="27" fill="#d2dce2">22集苏晚左踝受伤；23跪坐牵梁</text><text x="3250" y="956" font-size="27" fill="#d2dce2">，周辰肩伤再渗；24双钟空席只作</text><text x="3250" y="997" font-size="27" fill="#d2dce2">演示，不提前完成实际300年。</text><text x="3250" y="1370" font-size="34" font-weight="bold" fill="#b5cad5">镜头接触重点</text><text x="3250" y="1435" font-size="27" fill="#d2dce2">真石撞痕偏离旧光轨、人工外扣锈结</text><text x="3250" y="1476" font-size="27" fill="#d2dce2">、安全绳勒停、桥梁入救援槽、近阶</text><text x="3250" y="1517" font-size="27" fill="#d2dce2">收回逐项拍。</text><text x="70" y="1995" font-size="31" fill="#d2dce2">蓝色节点是功能位置，不代表可任意穿越；实线亦可能是调度关系，须以箭头文字和剧本判断。</text><text x="70" y="2055" font-size="29" fill="#a8b7c3">制作检查：演员走位、兵器半径、距离、绳长与承重仍需分镜实测；本图不提供工程安全数值。</text><text x="70" y="2115" font-size="29" fill="#a8b7c3">独立建立图负责奇观与材质；本图负责行动因果。两者不一致时按剧本与本图修订环境，禁止静默改剧情。</text></svg>