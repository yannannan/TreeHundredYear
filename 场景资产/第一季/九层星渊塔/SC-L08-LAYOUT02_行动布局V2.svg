<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#243746" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9c7dc"/></marker></defs><style>text{font-family:Microsoft YaHei,sans-serif}</style><rect width="100%" height="100%" fill="#0e1822"/><rect x="50" y="230" width="3110" height="1670" rx="24" fill="url(#grid)" stroke="#354b5a" stroke-width="3"/><text x="64" y="105" font-size="64" font-weight="bold" fill="#a9c7dc">SC-L08｜众生悬桥 · 行动与因果布局 V2</text><text x="66" y="175" font-size="31" fill="#b9c8d2">第一季 第25—27集　｜　方向：左侧入域 → 右侧阶段终点　｜　示意不等比，箭头含行动、调度及信息关系</text><path d="M300 1180H3000" stroke="#8aa7b8" stroke-width="80" opacity="0.15"/><rect x="1300" y="330" width="95" height="125" rx="35" fill="#233644" stroke="#edb46b" stroke-width="5"/><text x="1347" y="405" text-anchor="middle" font-size="31" fill="#e3eaf0">01</text><rect x="1440" y="330" width="95" height="125" rx="35" fill="#233644" stroke="#edb46b" stroke-width="5"/><text x="1487" y="405" text-anchor="middle" font-size="31" fill="#e3eaf0">02</text><rect x="1580" y="330" width="95" height="125" rx="35" fill="#233644" stroke="#edb46b" stroke-width="5"/><text x="1627" y="405" text-anchor="middle" font-size="31" fill="#e3eaf0">03</text><rect x="1720" y="330" width="95" height="125" rx="35" fill="#233644" stroke="#edb46b" stroke-width="5"/><text x="1767" y="405" text-anchor="middle" font-size="31" fill="#e3eaf0">04</text><rect x="1860" y="330" width="95" height="125" rx="35" fill="#233644" stroke="#9abacb" stroke-width="5"/><text x="1907" y="405" text-anchor="middle" font-size="31" fill="#e3eaf0">05</text><rect x="2000" y="330" width="95" height="125" rx="35" fill="#233644" stroke="#9abacb" stroke-width="5"/><text x="2047" y="405" text-anchor="middle" font-size="31" fill="#e3eaf0">06</text><rect x="1300" y="500" width="95" height="125" rx="35" fill="#233644" stroke="#9abacb" stroke-width="5"/><text x="1347" y="575" text-anchor="middle" font-size="31" fill="#e3eaf0">07</text><rect x="1440" y="500" width="95" height="125" rx="35" fill="#233644" stroke="#9abacb" stroke-width="5"/><text x="1487" y="575" text-anchor="middle" font-size="31" fill="#e3eaf0">08</text><rect x="1580" y="500" width="95" height="125" rx="35" fill="#233644" stroke="#9abacb" stroke-width="5"/><text x="1627" y="575" text-anchor="middle" font-size="31" fill="#e3eaf0">09</text><rect x="1720" y="500" width="95" height="125" rx="35" fill="#233644" stroke="#9abacb" stroke-width="5"/><text x="1767" y="575" text-anchor="middle" font-size="31" fill="#e3eaf0">10</text><rect x="1860" y="500" width="95" height="125" rx="35" fill="#233644" stroke="#9abacb" stroke-width="5"/><text x="1907" y="575" text-anchor="middle" font-size="31" fill="#e3eaf0">11</text><rect x="2000" y="500" width="95" height="125" rx="35" fill="#233644" stroke="#9abacb" stroke-width="5"/><text x="2047" y="575" text-anchor="middle" font-size="31" fill="#e3eaf0">12</text><path d="M480 1160Q745 1320 1010 1610" fill="none" stroke="#a9c7dc" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="560" y="1270" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="580" y="1308" font-size="24" fill="#d3e0e8">一次修复后持续站位</text><path d="M1550 690Q1665 995 1780 1170" fill="none" stroke="#a9c7dc" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1480" y="945" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1500" y="983" font-size="24" fill="#d3e0e8">四急先出 / 八舱仍静置</text><path d="M1790 1640Q1785 1340 1780 1170" fill="none" stroke="#a9c7dc" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1600" y="1290" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1620" y="1328" font-size="24" fill="#d3e0e8">父亲独立支路接入</text><path d="M1780 1170Q2190 1005 2600 1180" fill="none" stroke="#a9c7dc" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2005" y="955" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2025" y="993" font-size="24" fill="#d3e0e8">被救者互助过缝</text><path d="M2600 1180Q2755 875 2910 700" fill="none" stroke="#a9c7dc" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2570" y="825" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2590" y="863" font-size="24" fill="#d3e0e8">五人核对 / 独储落锁</text><path d="M480 1247V1830H3060V700H2910" fill="none" stroke="#a9c7dc" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1615" y="1780" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1635" y="1818" font-size="24" fill="#d3e0e8">最后降载 / 主角才可过桥</text><rect x="305" y="1073" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#a9c7dc" stroke-width="3"/><text x="330" y="1116" font-size="30" font-weight="bold" fill="#a9c7dc">A</text><text x="330" y="1164" font-size="29" fill="#edf2f5">近端双同步位</text><rect x="835" y="1523" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#a9c7dc" stroke-width="3"/><text x="860" y="1566" font-size="30" font-weight="bold" fill="#a9c7dc">B</text><text x="860" y="1614" font-size="29" fill="#edf2f5">一次接地 / 储能</text><rect x="1375" y="603" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#a9c7dc" stroke-width="3"/><text x="1400" y="646" font-size="30" font-weight="bold" fill="#a9c7dc">C</text><text x="1400" y="694" font-size="29" fill="#edf2f5">十二单人舱 / 四急</text><text x="1400" y="738" font-size="29" fill="#edf2f5">八缓</text><rect x="1605" y="1083" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#a9c7dc" stroke-width="3"/><text x="1630" y="1126" font-size="30" font-weight="bold" fill="#a9c7dc">D</text><text x="1630" y="1174" font-size="29" fill="#edf2f5">载人接板 / 绳</text><rect x="1615" y="1553" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#a9c7dc" stroke-width="3"/><text x="1640" y="1596" font-size="30" font-weight="bold" fill="#a9c7dc">E</text><text x="1640" y="1644" font-size="29" fill="#edf2f5">沈砚下方升板支路</text><rect x="2425" y="1093" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#a9c7dc" stroke-width="3"/><text x="2450" y="1136" font-size="30" font-weight="bold" fill="#a9c7dc">F</text><text x="2450" y="1184" font-size="29" fill="#edf2f5">五人中转屋 / 独储</text><rect x="2735" y="613" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#a9c7dc" stroke-width="3"/><text x="2760" y="656" font-size="30" font-weight="bold" fill="#a9c7dc">G</text><text x="2760" y="704" font-size="29" fill="#edf2f5">卸载后机械锁桥</text><rect x="3220" y="230" width="560" height="1670" rx="24" fill="#182735" stroke="#3f5462" stroke-width="3"/><text x="3250" y="325" font-size="34" font-weight="bold" fill="#a9c7dc">危险与不可绕过</text><text x="3250" y="390" font-size="27" fill="#d2dce2">两位主角不能离台去扶人；四急加沈</text><text x="3250" y="431" font-size="27" fill="#d2dce2">砚共五人只是中转，未回家。图中只</text><text x="3250" y="472" font-size="27" fill="#d2dce2">画十二编号舱，沈砚在下层独立路由</text><text x="3250" y="513" font-size="27" fill="#d2dce2">，不额外加第13个同型舱。</text><text x="3250" y="850" font-size="34" font-weight="bold" fill="#a9c7dc">连续性锁</text><text x="3250" y="915" font-size="27" fill="#d2dce2">26形成稳定共鸣。27小满弃鞋抓</text><text x="3250" y="956" font-size="27" fill="#d2dce2">绳，被救成人铺衣；五人挂独储后主</text><text x="3250" y="997" font-size="27" fill="#d2dce2">角才走。接地扣烧断、空匣留八层不</text><text x="3250" y="1038" font-size="27" fill="#d2dce2">能再带走。</text><text x="3250" y="1370" font-size="34" font-weight="bold" fill="#a9c7dc">镜头接触重点</text><text x="3250" y="1435" font-size="27" fill="#d2dce2">十二舱编号01—12，其中01—</text><text x="3250" y="1476" font-size="27" fill="#d2dce2">04为四急的制作标记不擅定角色对</text><text x="3250" y="1517" font-size="27" fill="#d2dce2">应编号；双台离手红线、接板缝、衣</text><text x="3250" y="1558" font-size="27" fill="#d2dce2">绳、独储锁、烧断扣逐项。</text><text x="70" y="1995" font-size="31" fill="#d2dce2">蓝色节点是功能位置，不代表可任意穿越；实线亦可能是调度关系，须以箭头文字和剧本判断。</text><text x="70" y="2055" font-size="29" fill="#a8b7c3">制作检查：演员走位、兵器半径、距离、绳长与承重仍需分镜实测；本图不提供工程安全数值。</text><text x="70" y="2115" font-size="29" fill="#a8b7c3">独立建立图负责奇观与材质；本图负责行动因果。两者不一致时按剧本与本图修订环境，禁止静默改剧情。</text></svg>