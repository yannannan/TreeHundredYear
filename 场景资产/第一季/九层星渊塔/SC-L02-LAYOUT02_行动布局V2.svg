ht="174" rx="20" fill="#1b2d3b" stroke="#98cae8" stroke-width="3"/><text x="2170" y="1516" font-size="30" font-weight="bold" fill="#98cae8">F</text><text x="2170" y="1564" font-size="29" fill="#edf2f5">真实刀槽</text><rect x="2735" y="1043" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#98cae8" stroke-width="3"/><text x="2760" y="1086" font-size="30" font-weight="bold" fill="#98cae8">G</text><text x="2760" y="1134" font-size="29" fill="#edf2f5">唯一合流出口</text><rect x="3220" y="230" width="560" height="1670" rx="24" fill="#182735" stroke="#3f5462" stroke-width="3"/><text x="3250" y="325" font-size="34" font-weight="bold" fill="#98cae8">危险与不可绕过</text><text x="3250" y="390" font-size="27" fill="#d2dce2">假影不能抓人或造成直接伤害；致命</text><text x="3250" y="431" font-size="27" fill="#d2dce2">的是沿实体槽扫来的刀。镜墙不能靠</text><text x="3250" y="472" font-size="27" fill="#d2dce2">猜中身份自动融化。</text><text x="3250" y="850" font-size="34" font-weight="bold" fill="#98cae8">连续性锁</text><text x="3250" y="915" font-size="27" fill="#d2dce2">06集起真周辰始终在另一巷；07</text><text x="3250" y="956" font-size="27" fill="#d2dce2">随机触觉验真不是读心，左袖切伤保</text><text x="3250" y="997" font-size="27" fill="#d2dce2">留；08现代雨城只闪在碎镜，不能</text><text x="3250" y="1038" font-size="27" fill="#d2dce2">整体换成现代街道。</text><text x="3250" y="1370" font-size="34" font-weight="bold" fill="#98cae8">镜头接触重点</text><text x="3250" y="1435" font-size="27" fill="#d2dce2">门轴孔、左右绳扣、刀槽入刃口、灯</text><text x="3250" y="1476" font-size="27" fill="#d2dce2">座与影锁各给接触近景；镜中假人不</text><text x="3250" y="1517" font-size="27" fill="#d2dce2">进入真实遮挡关系。</text><text x="70" y="1995" font-size="31" fill="#d2dce2">蓝色节点是功能位置，不代表可任意穿越；实线亦可能是调度关系，须以箭头文字和剧本判断。</text><text x="70" y="2055" font-size="29" fill="#a8b7c3">制作检查：演员走位、兵器半径、距离、绳长与承重仍需分镜实测；本图不提供工程安全数值。</text><text x="70" y="2115" font-size="29" fill="#a8b7c3">独立建立图负责奇观与材质；本图负责行动因果。两者不一致时按剧本与本图修订环境，禁止静默改剧情。</text></svg>