<rect x="2180" y="1030" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2200" y="1068" font-size="24" fill="#d3e0e8">辨清承重 / 拆私锁</text><path d="M2360 1550Q2640 1415 2920 1150" fill="none" stroke="#edb66f" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2455" y="1365" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2475" y="1403" font-size="24" fill="#d3e0e8">保住灯群 / 走真侧阶</text><rect x="255" y="1113" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#edb66f" stroke-width="3"/><text x="280" y="1156" font-size="30" font-weight="bold" fill="#edb66f">A</text><text x="280" y="1204" font-size="29" fill="#edf2f5">循环街 / 饼摊</text><rect x="905" y="623" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#edb66f" stroke-width="3"/><text x="930" y="666" font-size="30" font-weight="bold" fill="#edb66f">B</text><text x="930" y="714" font-size="29" fill="#edf2f5">交易灯 / 真钥匙柜</text><rect x="935" y="1443" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#edb66f" stroke-width="3"/><text x="960" y="1486" font-size="30" font-weight="bold" fill="#edb66f">C</text><text x="960" y="1534" font-size="29" fill="#edf2f5">独行正门 / 真上行</text><text x="960" y="1578" font-size="29" fill="#edf2f5">风</text><rect x="1595" y="1073" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#edb66f" stroke-width="3"/><text x="1620" y="1116" font-size="30" font-weight="bold" fill="#edb66f">D</text><text x="1620" y="1164" font-size="29" fill="#edf2f5">运水道 / 桥腹</text><rect x="2195" y="653" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#edb66f" stroke-width="3"/><text x="2220" y="696" font-size="30" font-weight="bold" fill="#edb66f">E</text><text x="2220" y="744" font-size="29" fill="#edf2f5">私锁侧闸 / 重砣</text><rect x="2185" y="1463" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#edb66f" stroke-width="3"/><text x="2210" y="1506" font-size="30" font-weight="bold" fill="#edb66f">F</text><text x="2210" y="1554" font-size="29" fill="#edf2f5">旧主架 / 新铜带</text><rect x="2745" y="1063" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#edb66f" stroke-width="3"/><text x="2770" y="1106" font-size="30" font-weight="bold" fill="#edb66f">G</text><text x="2770" y="1154" font-size="29" fill="#edf2f5">检修上行出口</text><rect x="3220" y="230" width="560" height="1670" rx="24" fill="#182735" stroke="#3f5462" stroke-width="3"/><text x="3250" y="325" font-size="34" font-weight="bold" fill="#edb66f">危险与不可绕过</text><text x="3250" y="390" font-size="27" fill="#d2dce2">独行正门是真的，A路非假陷阱；侧</text><text x="3250" y="431" font-size="27" fill="#d2dce2">门是人为垄断。硬拉压闸会扯落灯架</text><text x="3250" y="472" font-size="27" fill="#d2dce2">，必须分清主架与私加铜带。</text><text x="3250" y="850" font-size="34" font-weight="bold" fill="#edb66f">连续性锁</text><text x="3250" y="915" font-size="27" fill="#d2dce2">售出的记忆不归还，留下不等于原谅</text><text x="3250" y="956" font-size="27" fill="#d2dce2">。20集钥匙被压弯；21集解决实</text><text x="3250" y="997" font-size="27" fill="#d2dce2">体闸，不通过砸毁全市得到道德胜利</text><text x="3250" y="1038" font-size="27" fill="#d2dce2">。</text><text x="3250" y="1370" font-size="34" font-weight="bold" fill="#edb66f">镜头接触重点</text><text x="3250" y="1435" font-size="27" fill="#d2dce2">交易前后真实商品、弯钥匙齿、湿车</text><text x="3250" y="1476" font-size="27" fill="#d2dce2">辙、新旧钉孔、压闸杆与主架关联要</text><text x="3250" y="1517" font-size="27" fill="#d2dce2">拍清，不一剪就开门。</text><text x="70" y="1995" font-size="31" fill="#d2dce2">蓝色节点是功能位置，不代表可任意穿越；实线亦可能是调度关系，须以箭头文字和剧本判断。</text><text x="70" y="2055" font-size="29" fill="#a8b7c3">制作检查：演员走位、兵器半径、距离、绳长与承重仍需分镜实测；本图不提供工程安全数值。</text><text x="70" y="2115" font-size="29" fill="#a8b7c3">独立建立图负责奇观与材质；本图负责行动因果。两者不一致时按剧本与本图修订环境，禁止静默改剧情。</text></svg>