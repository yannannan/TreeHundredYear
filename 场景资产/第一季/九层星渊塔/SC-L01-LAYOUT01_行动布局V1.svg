<text x="1152" y="1238" font-size="27" fill="#17212b" font-weight="700">周</text>
<rect x="240" y="1500" width="530" height="116" rx="14" fill="#0c1b2b" stroke="#d4ad67" stroke-width="2" opacity=".96"/><text x="262" y="1543" font-size="36" fill="#d4ad67" font-weight="700">A 起始梁 / 周辰控绳</text><text x="262" y="1586" font-size="26" fill="#b6c9d6" font-weight="400">两人不可同时压上临时链</text>
<rect x="850" y="1370" width="570" height="116" rx="14" fill="#0c1b2b" stroke="#f58d83" stroke-width="2" opacity=".96"/><text x="872" y="1413" font-size="36" fill="#f58d83" font-weight="700">B 断桥缺口 / 苏晚起摆</text><text x="872" y="1456" font-size="26" fill="#b6c9d6" font-weight="400">第一次未踩住，压绳减速</text>
<rect x="1930" y="1110" width="620" height="116" rx="14" fill="#0c1b2b" stroke="#6dd6ff" stroke-width="2" opacity=".96"/><text x="1952" y="1153" font-size="36" fill="#6dd6ff" font-weight="700">C 对岸窄沿</text><text x="1952" y="1196" font-size="26" fill="#b6c9d6" font-weight="400">第二次落稳 → 扣真锚 → 回绳</text>
<rect x="2070" y="600" width="610" height="116" rx="14" fill="#0c1b2b" stroke="#e7c77d" stroke-width="2" opacity=".96"/><text x="2092" y="643" font-size="36" fill="#e7c77d" font-weight="700">D 真锚侧 / 真实承重环</text><text x="2092" y="686" font-size="26" fill="#b6c9d6" font-weight="400">与临时旧链分开，不混为一处</text>
<rect x="2230" y="365" width="470" height="116" rx="14" fill="#0c1b2b" stroke="#8fe1a6" stroke-width="2" opacity=".96"/><text x="2252" y="408" font-size="36" fill="#8fe1a6" font-weight="700">E 出口石台</text><text x="2252" y="451" font-size="26" fill="#b6c9d6" font-weight="400">两人过关后休息 / 验触觉</text>
<rect x="1260" y="390" width="640" height="116" rx="14" fill="#0c1b2b" stroke="#d4ad67" stroke-width="2" opacity=".96"/><text x="1282" y="433" font-size="36" fill="#d4ad67" font-weight="700">P 旧链整环 / 临时挂点</text><text x="1282" y="476" font-size="26" fill="#b6c9d6" font-weight="400">先试载，锈环断后移至整环</text>
<rect x="250" y="460" width="610" height="116" rx="14" fill="#0c1b2b" stroke="#d4ad67" stroke-width="2" opacity=".96"/><text x="272" y="503" font-size="36" fill="#d4ad67" font-weight="700">G1 当前局部重力区</text><text x="272" y="546" font-size="26" fill="#b6c9d6" font-weight="400">细脉冲触环槽，本区转90°</text>
<rect x="2030" y="1430" width="600" height="116" rx="14" fill="#0c1b2b" stroke="#d4ad67" stroke-width="2" opacity=".96"/><text x="2052" y="1473" font-size="36" fill="#d4ad67" font-weight="700">G2 对岸重力区</text><text x="2052" y="1516" font-size="26" fill="#b6c9d6" font-weight="400">瀑布保持另一方向，不随G1转</text>
<text x="1450" y="1570" font-size="43" fill="#7896aa" font-weight="700">深渊 / 真实坠落危险</text>
<text x="1495" y="1620" font-size="28" fill="#7591a3" font-weight="400">不死不代替承重、疼痛与落点</text>
</g>
<rect x="2820" y="300" width="940" height="1480" rx="28" fill="#102333" stroke="#3a5869" stroke-width="2"/>
<text x="2870" y="378" font-size="46" fill="#f0dfbd" font-weight="700">行动顺序与校核点</text>
<text x="2870" y="432" font-size="29" fill="#9cb8ca" font-weight="400">与第04—05集正文对应</text>
<rect x="2860" y="480" width="860" height="190" rx="16" fill="#142d3e" stroke="#28495d"/><circle cx="2918" cy="531" r="30" fill="#b49a64"/><text x="2898" y="541" font-size="27" fill="#102230" font-weight="700">01</text><text x="2975" y="540" font-size="33" fill="#e4e8e4" font-weight="700">先测方向，再试旧链</text><text x="2890" y="595" font-size="27" fill="#a6c0d0" font-weight="400">两粒砂验证G1/G2不同。</text><text x="2890" y="638" font-size="27" fill="#a6c0d0" font-weight="400">锈环试载断裂后，改扣完整旧环。</text><rect x="2860" y="700" width="860" height="190" rx="16" fill="#142d3e" stroke="#28495d"/><circle cx="2918" cy="751" r="30" fill="#b49a64"/><text x="2898" y="761" font-size="27" fill="#102230" font-weight="700">02</text><text x="2975" y="760" font-size="33" fill="#e4e8e4" font-weight="700">第一摆失败，不能剪掉</text><text x="2890" y="815" font-size="27" fill="#a6c0d0" font-weight="400">苏晚足尖未踩住窄沿。</text><text x="2890" y="858" font-size="27" fill="#a6c0d0" font-weight="400">周辰压绳减速，苏晚没有瞬移过关。</text><rect x="2860" y="920" width="860" height="190" rx="16" fill="#142d3e" stroke="#28495d"/><circle cx="2918" cy="971" r="30" fill="#b49a64"/><text x="2898" y="981" font-size="27" fill="#102230" font-weight="700">03</text><text x="2975" y="980" font-size="33" fill="#e4e8e4" font-weight="700">第二摆落稳，建立真锚</text><text x="2890" y="1035" font-size="27" fill="#a6c0d0" font-weight="400">苏晚抓链后第二次落到C。</text><text x="2890" y="1078" font-size="27" fill="#a6c0d0" font-weight="400">跪下扣D真实承重环，再抛回绳。</text><rect x="2860" y="1140" width="860" height="190" rx="16" fill="#142d3e" stroke="#28495d"/><circle cx="2918" cy="1191" r="30" fill="#b49a64"/><text x="2898" y="1201" font-size="27" fill="#102230" font-weight="700">04</text><text x="2975" y="1200" font-size="33" fill="#e4e8e4" font-weight="700">周辰过界，斩断拖拽连接</text><text x="2890" y="1255" font-size="27" fill="#a6c0d0" font-weight="400">按苏晚拍点发细脉冲借方向差。</text><text x="2890" y="1298" font-size="27" fill="#a6c0d0" font-weight="400">滑至D侧，确认安全后才斩连接。</text><rect x="2860" y="1360" width="860" height="190" rx="16" fill="#142d3e" stroke="#28495d"/><circle cx="2918" cy="1411" r="30" fill="#b49a64"/><text x="2898" y="1421" font-size="27" fill="#102230" font-weight="700">05</text><text x="2975" y="1420" font-size="33" fill="#e4e8e4" font-weight="700">两人抵达E，代价仍在</text><text x="2890" y="1475" font-size="27" fill="#a6c0d0" font-weight="400">铁销被巨环咬碎留在身后。</text><text x="2890" y="1518" font-size="27" fill="#a6c0d0" font-weight="400">古符不回来，衣服与体力不重置。</text>
<text x="2875" y="1650" font-size="25" fill="#a7bfcc" font-weight="400">身份与服装按已认可原图；此处仅符号示位。</text>
<text x="2875" y="1698" font-size="25" fill="#a7bfcc" font-weight="400">实际距离、绳长、承重与机位须在分镜中校准。</text>
