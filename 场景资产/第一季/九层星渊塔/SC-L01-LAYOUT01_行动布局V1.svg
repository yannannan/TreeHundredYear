<path d="M1150 1889H1340" stroke="#6dd6ff" stroke-width="11" marker-end="url(#blue)"/><text x="1370" y="1900" font-size="29" fill="#b5e9ff" font-weight="400">苏晚第二摆 / 成功</text>
<path d="M1960 1889H2150" stroke="#8fe1a6" stroke-width="10" stroke-dasharray="19 10" marker-end="url(#green)"/><text x="2180" y="1900" font-size="29" fill="#c2e6ca" font-weight="400">周辰后过界 / 真锚已立</text>
<path d="M3050 1889H3240" stroke="#d4ad67" stroke-width="5" stroke-dasharray="13 13"/><text x="3270" y="1900" font-size="29" fill="#d9c59c" font-weight="400">重力边界</text>
<text x="125" y="1977" font-size="30" fill="#c3d5df" font-weight="400">制作要求：先建立近梁—旧链—窄沿—真锚—出口的同一空间，再拍局部接触；远处景桥不是主角的免费绕行路。</text>
<text x="125" y="2032" font-size="28" fill="#8faebf" font-weight="400">拓扑校对图不是比例/工程证明。巨环、瀑流、尘粒的方向变化须在动态镜头测试，禁止用无因漂浮和换轴代替规则。</text>
