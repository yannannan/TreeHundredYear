ont-size="27" fill="#d2dce2">结构逐项。</text><text x="70" y="1995" font-size="31" fill="#d2dce2">蓝色节点是功能位置，不代表可任意穿越；实线亦可能是调度关系，须以箭头文字和剧本判断。</text><text x="70" y="2055" font-size="29" fill="#a8b7c3">制作检查：演员走位、兵器半径、距离、绳长与承重仍需分镜实测；本图不提供工程安全数值。</text><text x="70" y="2115" font-size="29" fill="#a8b7c3">独立建立图负责奇观与材质；本图负责行动因果。两者不一致时按剧本与本图修订环境，禁止静默改剧情。</text></svg>