<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#243746" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d5b371"/></marker></defs><style>text{font-family:Microsoft YaHei,sans-serif}</style><rect width="100%" height="100%" fill="#0e1822"/><rect x="50" y="230" width="3110" height="1670" rx="24" fill="url(#grid)" stroke="#354b5a" stroke-width="3"/><text x="64" y="105" font-size="64" font-weight="bold" fill="#d5b371">SC-L09｜终焉授印 · 行动与因果布局 V2</text><text x="66" y="175" font-size="31" fill="#b9c8d2">第一季 第28—29集　｜　方向：左侧入域 → 右侧阶段终点　｜　示意不等比，箭头含行动、调度及信息关系</text><ellipse cx="1800" cy="440" rx="290" ry="85" fill="none" stroke="#d6ad6d" stroke-width="5" opacity="0.23"/><ellipse cx="1800" cy="440" rx="345" ry="104" fill="none" stroke="#d6ad6d" stroke-width="5" opacity="0.23"/><ellipse cx="1800" cy="440" rx="400" ry="123" fill="none" stroke="#d6ad6d" stroke-width="5" opacity="0.23"/><ellipse cx="1800" cy="440" rx="455" ry="142" fill="none" stroke="#d6ad6d" stroke-width="5" opacity="0.23"/><ellipse cx="1800" cy="440" rx="510" ry="161" fill="none" stroke="#d6ad6d" stroke-width="5" opacity="0.23"/><ellipse cx="1800" cy="440" rx="565" ry="180" fill="none" stroke="#d6ad6d" stroke-width="5" opacity="0.23"/><ellipse cx="1800" cy="440" rx="620" ry="199" fill="none" stroke="#d6ad6d" stroke-width="5" opacity="0.23"/><ellipse cx="1800" cy="440" rx="675" ry="218" fill="none" stroke="#d6ad6d" stroke-width="5" opacity="0.23"/><ellipse cx="1800" cy="440" rx="730" ry="237" fill="none" stroke="#d6ad6d" stroke-width="5" opacity="0.23"/><path d="M430 1220Q760 1315 1090 1540" fill="none" stroke="#d5b371" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="575" y="1265" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="595" y="1303" font-size="24" fill="#d3e0e8">薄符反射 / 撤半圈</text><path d="M1090 1540Q1110 1205 1130 740" fill="none" stroke="#d5b371" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="925" y="1155" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="945" y="1193" font-size="24" fill="#d3e0e8">观察诱斩窗口</text><path d="M1130 740Q1455 885 1780 1160" fill="none" stroke="#d5b371" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1270" y="835" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1290" y="873" font-size="24" fill="#d3e0e8">铁剑楔地槽 / 石台承重</text><path d="M1780 1160Q2065 1015 2350 740" fill="none" stroke="#d5b371" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1880" y="965" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1900" y="1003" font-size="24" fill="#d3e0e8">第一封断 / 剑折</text><path d="M2350 740Q2350 1070 2350 1530" fill="none" stroke="#d5b371" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2165" y="1020" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2185" y="1058" font-size="24" fill="#d3e0e8">断刃勾链 / 近压第二封</text><path d="M2350 1530Q2630 1405 2910 1150" fill="none" stroke="#d5b371" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2445" y="1355" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2465" y="1393" font-size="24" fill="#d3e0e8">卫跪九环停 / 真奖出现</text><rect x="255" y="1133" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d5b371" stroke-width="3"/><text x="280" y="1176" font-size="30" font-weight="bold" fill="#d5b371">A</text><text x="280" y="1224" font-size="29" fill="#edf2f5">入口 / 半圈退路</text><rect x="915" y="1453" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d5b371" stroke-width="3"/><text x="940" y="1496" font-size="30" font-weight="bold" fill="#d5b371">B</text><text x="940" y="1544" font-size="29" fill="#edf2f5">倒柱 / 标线</text><rect x="955" y="653" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d5b371" stroke-width="3"/><text x="980" y="696" font-size="30" font-weight="bold" fill="#d5b371">C</text><text x="980" y="744" font-size="29" fill="#edf2f5">台柱 / 实体地槽</text><rect x="1605" y="1073" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d5b371" stroke-width="3"/><text x="1630" y="1116" font-size="30" font-weight="bold" fill="#d5b371">D</text><text x="1630" y="1164" font-size="29" fill="#edf2f5">唯一授印卫 / 刃路</text><rect x="2175" y="653" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d5b371" stroke-width="3"/><text x="2200" y="696" font-size="30" font-weight="bold" fill="#d5b371">E</text><text x="2200" y="744" font-size="29" fill="#edf2f5">相位封印一</text><rect x="2175" y="1443" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d5b371" stroke-width="3"/><text x="2200" y="1486" font-size="30" font-weight="bold" fill="#d5b371">F</text><text x="2200" y="1534" font-size="29" fill="#edf2f5">相位封印二</text><rect x="2735" y="1063" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#d5b371" stroke-width="3"/><text x="2760" y="1106" font-size="30" font-weight="bold" fill="#d5b371">G</text><text x="2760" y="1154" font-size="29" fill="#edf2f5">真实奖励 / 归途门</text><rect x="3220" y="230" width="560" height="1670" rx="24" fill="#182735" stroke="#3f5462" stroke-width="3"/><text x="3250" y="325" font-size="34" font-weight="bold" fill="#d5b371">危险与不可绕过</text><text x="3250" y="390" font-size="27" fill="#d2dce2">镜胸反射术法，实体剑不会被魔法反</text><text x="3250" y="431" font-size="27" fill="#d2dce2">射但会被护翼弹开。巨刃由地槽承重</text><text x="3250" y="472" font-size="27" fill="#d2dce2">，不能画男主单腕托巨刃；双封窗口</text><text x="3250" y="513" font-size="27" fill="#d2dce2">是先后配合。</text><text x="3250" y="850" font-size="34" font-weight="bold" fill="#d5b371">连续性锁</text><text x="3250" y="915" font-size="27" fill="#d2dce2">28旧剑沿累积缺口真断，不能29</text><text x="3250" y="956" font-size="27" fill="#d2dce2">继续完整持剑。双方活着通过后29</text><text x="3250" y="997" font-size="27" fill="#d2dce2">各自拒奖并拒离才开隐藏门；光暖不</text><text x="3250" y="1038" font-size="27" fill="#d2dce2">代表伪奖励。</text><text x="3250" y="1370" font-size="34" font-weight="bold" fill="#d5b371">镜头接触重点</text><text x="3250" y="1435" font-size="27" fill="#d2dce2">镜面反射原路、标线对比两轮、刃背</text><text x="3250" y="1476" font-size="27" fill="#d2dce2">与地槽接触、断剑截面、护翼拖链、</text><text x="3250" y="1517" font-size="27" fill="#d2dce2">第二封需要近身压柄。</text><text x="70" y="1995" font-size="31" fill="#d2dce2">蓝色节点是功能位置，不代表可任意穿越；实线亦可能是调度关系，须以箭头文字和剧本判断。</text><text x="70" y="2055" font-size="29" fill="#a8b7c3">制作检查：演员走位、兵器半径、距离、绳长与承重仍需分镜实测；本图不提供工程安全数值。</text><text x="70" y="2115" font-size="29" fill="#a8b7c3">独立建立图负责奇观与材质；本图负责行动因果。两者不一致时按剧本与本图修订环境，禁止静默改剧情。</text></svg>