<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#243746" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ccc7b2"/></marker></defs><style>text{font-family:Microsoft YaHei,sans-serif}</style><rect width="100%" height="100%" fill="#0e1822"/><rect x="50" y="230" width="3110" height="1670" rx="24" fill="url(#grid)" stroke="#354b5a" stroke-width="3"/><text x="64" y="105" font-size="64" font-weight="bold" fill="#ccc7b2">SC-L04｜无声律庭 · 行动与因果布局 V2</text><text x="66" y="175" font-size="31" fill="#b9c8d2">第一季 第12—13集　｜　方向：左侧入域 → 右侧阶段终点　｜　示意不等比，箭头含行动、调度及信息关系</text><path d="M330 330L500 1800" stroke="#ccc7b2" stroke-width="18" opacity="0.07"/><path d="M750 330L860 1800" stroke="#ccc7b2" stroke-width="18" opacity="0.07"/><path d="M1170 330L1220 1800" stroke="#ccc7b2" stroke-width="18" opacity="0.07"/><path d="M1590 330L1580 1800" stroke="#ccc7b2" stroke-width="18" opacity="0.07"/><path d="M2010 330L1940 1800" stroke="#ccc7b2" stroke-width="18" opacity="0.07"/><path d="M2430 330L2300 1800" stroke="#ccc7b2" stroke-width="18" opacity="0.07"/><path d="M2850 330L2660 1800" stroke="#ccc7b2" stroke-width="18" opacity="0.07"/><path d="M430 1190Q750 890 1070 720" fill="none" stroke="#ccc7b2" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="565" y="840" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="585" y="878" font-size="24" fill="#d3e0e8">保护承诺反噬</text><path d="M1070 720Q1090 1185 1110 1520" fill="none" stroke="#ccc7b2" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="905" y="1135" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="925" y="1173" font-size="24" fill="#d3e0e8">释约后实体退守</text><path d="M1110 1520Q1440 1275 1770 1160" fill="none" stroke="#ccc7b2" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1255" y="1225" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1275" y="1263" font-size="24" fill="#d3e0e8">引刀 / 首次挂带退回</text><path d="M1770 1160Q2060 1015 2350 740" fill="none" stroke="#ccc7b2" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="1875" y="965" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="1895" y="1003" font-size="24" fill="#d3e0e8">旧鞘抵柱卡刃</text><path d="M2350 740Q2350 1070 2350 1530" fill="none" stroke="#ccc7b2" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2165" y="1020" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2185" y="1058" font-size="24" fill="#d3e0e8">苏晚切实索转栓</text><path d="M2350 1530Q2635 1405 2920 1150" fill="none" stroke="#ccc7b2" stroke-width="7" opacity="0.8" marker-end="url(#arrow)" /><rect x="2450" y="1355" width="370" height="90" rx="12" fill="#101d29" opacity="0.96"/><text x="2470" y="1393" font-size="24" fill="#d3e0e8">弃鞘滚出边界</text><rect x="255" y="1103" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#ccc7b2" stroke-width="3"/><text x="280" y="1146" font-size="30" font-weight="bold" fill="#ccc7b2">A</text><text x="280" y="1194" font-size="29" fill="#edf2f5">进刀薄廊</text><rect x="895" y="633" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#ccc7b2" stroke-width="3"/><text x="920" y="676" font-size="30" font-weight="bold" fill="#ccc7b2">B</text><text x="920" y="724" font-size="29" fill="#edf2f5">誓链牵引位</text><rect x="935" y="1433" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#ccc7b2" stroke-width="3"/><text x="960" y="1476" font-size="30" font-weight="bold" fill="#ccc7b2">C</text><text x="960" y="1524" font-size="29" fill="#edf2f5">石席掩体</text><rect x="1595" y="1073" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#ccc7b2" stroke-width="3"/><text x="1620" y="1116" font-size="30" font-weight="bold" fill="#ccc7b2">D</text><text x="1620" y="1164" font-size="29" fill="#edf2f5">柱根 / 律使转刀</text><rect x="2175" y="653" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#ccc7b2" stroke-width="3"/><text x="2200" y="696" font-size="30" font-weight="bold" fill="#ccc7b2">E</text><text x="2200" y="744" font-size="29" fill="#edf2f5">卡刀狭槽</text><rect x="2175" y="1443" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#ccc7b2" stroke-width="3"/><text x="2200" y="1486" font-size="30" font-weight="bold" fill="#ccc7b2">F</text><text x="2200" y="1534" font-size="29" fill="#edf2f5">实索 / 手动门栓</text><rect x="2745" y="1063" width="350" height="174" rx="20" fill="#1b2d3b" stroke="#ccc7b2" stroke-width="3"/><text x="2770" y="1106" font-size="30" font-weight="bold" fill="#ccc7b2">G</text><text x="2770" y="1154" font-size="29" fill="#edf2f5">追击权限边界</text><rect x="3220" y="230" width="560" height="1670" rx="24" fill="#182735" stroke="#3f5462" stroke-width="3"/><text x="3250" y="325" font-size="34" font-weight="bold" fill="#ccc7b2">危险与不可绕过</text><text x="3250" y="390" font-size="27" fill="#d2dce2">释约只解除承诺束缚，律使与长刃继</text><text x="3250" y="431" font-size="27" fill="#d2dce2">续攻击。柱根的狭槽只能卡住特定刀</text><text x="3250" y="472" font-size="27" fill="#d2dce2">路，不能像万能封印阵。</text><text x="3250" y="850" font-size="34" font-weight="bold" fill="#ccc7b2">连续性锁</text><text x="3250" y="915" font-size="27" fill="#d2dce2">苏晚13集失去本层术法仍能用短刃</text><text x="3250" y="956" font-size="27" fill="#d2dce2">；带尾剪断、旧剑鞘卡裂并弃在门内</text><text x="3250" y="997" font-size="27" fill="#d2dce2">。后层裸剑用布束，不再套回完整鞘</text><text x="3250" y="1038" font-size="27" fill="#d2dce2">。</text><text x="3250" y="1370" font-size="34" font-weight="bold" fill="#ccc7b2">镜头接触重点</text><text x="3250" y="1435" font-size="27" fill="#d2dce2">腕链受牵、石角挂住衣带、柱根转刀</text><text x="3250" y="1476" font-size="27" fill="#d2dce2">、狭槽承压、门栓实索各留可读接触</text><text x="3250" y="1517" font-size="27" fill="#d2dce2">点。</text><text x="70" y="1995" font-size="31" fill="#d2dce2">蓝色节点是功能位置，不代表可任意穿越；实线亦可能是调度关系，须以箭头文字和剧本判断。</text><text x="70" y="2055" font-size="29" fill="#a8b7c3">制作检查：演员走位、兵器半径、距离、绳长与承重仍需分镜实测；本图不提供工程安全数值。</text><text x="70" y="2115" font-size="29" fill="#a8b7c3">独立建立图负责奇观与材质；本图负责行动因果。两者不一致时按剧本与本图修订环境，禁止静默改剧情。</text></svg>